version: '3.8'

services:
  pz-server:
    build: .
    container_name: pz-server
    restart: unless-stopped
    environment:
      - SSH_PRIVATE_KEY_BASE64=YOUR_BASE64_KEY
      - REPO_URL=git@github.com:hrkcz001/pz-saves.git
      - GIT_USER_NAME=hrkcz001
      - GIT_USER_EMAIL=hrkcz001@gmail.com
      - SSH_PORT=2222
      - SERVER_NAME=vsrania
      - ADMIN_PASSWORD=Qwerty01234**
      - SERVER_MEMORY_MAX=8192m
      - SERVER_MEMORY_MIN=8192m
      - RESTORE_POLL_INTERVAL_SEC=10
      - WAIT_ON_CRASH_SEC=1800
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
