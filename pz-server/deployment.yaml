---
version: "2.0"
services:
  pz-server:
    image: ghcr.io/hrkcz001/pz-akash-server:sha-f080cc4
    expose:
      - port: 16261
        as: 16261
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 16262
        as: 16262
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 27015
        as: 27015
        proto: tcp
        to:
          - global: true
            ip: pz-ip
      - port: 2222
        as: 2222
        proto: tcp
        to:
          - global: true
            ip: pz-ip
    env:
      - >-
        SSH_PRIVATE_KEY_BASE64=
      - GIT_USER_NAME=hrkcz001
      - GIT_USER_EMAIL=hrkcz001@gmail.com
      - SSH_PORT=2222
      - SERVER_NAME=vsrania
      - ADMIN_PASSWORD=Qwerty0123**
      - SERVER_MEMORY_MAX=8192m
      - SERVER_MEMORY_MIN=8192m
      - RESTORE_POLL_INTERVAL_SEC=10
      - WAIT_ON_CRASH_SEC=1800
profiles:
  compute:
    pz-server:
      resources:
        cpu:
          units: 4
        memory:
          size: 10Gi
        storage:
          - size: 20Gi
  placement:
    pz-placement:
      pricing:
        pz-server:
          denom: uakt
          amount: 100000
deployment:
  pz-server:
    pz-placement:
      profile: pz-server
      count: 1
endpoints:
  pz-ip:
    kind: ip
