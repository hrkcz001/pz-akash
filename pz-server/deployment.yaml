---
version: "2.0"
services:
  pz-server:
    image: ghcr.io/hrkcz001/pz-akash-server:latest
    expose:
      - port: 16261
        as: 16261
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 16262
        as: 16262
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 27015
        as: 27015
        proto: tcp
        to:
          - global: true
            ip: pz-ip
      - port: 2222
        as: 2222
        proto: tcp
        to:
          - global: true
            ip: pz-ip
    env:
      - >-
        SSH_PRIVATE_KEY_BASE64="<YOUR_BASE64_SSH_KEY>"
      - REPO_URL=git@github.com:hrkcz001/pz-saves.git
      - GIT_USER_NAME=hrkcz001
      - GIT_USER_EMAIL=hrkcz001@gmail.com
profiles:
  compute:
    pz-server:
      resources:
        cpu:
          units: 4
        memory:
          size: 10Gi
        storage:
          - size: 20Gi
  placement:
    pz-placement:
      pricing:
        pz-server:
          denom: uakt
          amount: 100000
deployment:
  pz-server:
    pz-placement:
      profile: pz-server
      count: 1
endpoints:
  pz-ip:
    kind: ip
