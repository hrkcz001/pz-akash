name: Build and Publish Controller Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'pz-controller/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-controller

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout pz-akash repository
        uses: actions/checkout@v4

      - name: Checkout pz-saves (Private Configs & Mods)
        uses: actions/checkout@v4
        with:
          repository: hrkcz001/pz-saves
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY || secrets.PZ_SAVES_SSH_KEY }}
          path: pz-controller/pz-saves

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: pz-controller
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
