name: Build and Publish Server Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'pz-server/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server
  PZ_VERSION: "42.20.2"
  # Manifest IDs from SteamDB for version 42.20.2 (August 5 2026)
  # https://steamdb.info/depot/380871/manifests/
  # https://steamdb.info/depot/380873/manifests/
  DEPOT_380871_MANIFEST: "2587362105419356756"
  DEPOT_380873_MANIFEST: "4894029153115054997"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=pz-${{ env.PZ_VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: pz-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PZ_VERSION=${{ env.PZ_VERSION }}
            DEPOT_380871_MANIFEST=${{ env.DEPOT_380871_MANIFEST }}
            DEPOT_380873_MANIFEST=${{ env.DEPOT_380873_MANIFEST }}
          secrets: |
            steam_username=${{ secrets.STEAM_USERNAME }}
            steam_password=${{ secrets.STEAM_PASSWORD }}

