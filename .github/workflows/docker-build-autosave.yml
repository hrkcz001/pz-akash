name: Build and Publish Autosave Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'pz-autosave/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-autosave

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: pz-autosave
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment.yaml with new image SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s|image: ghcr.io/hrkcz001/pz-akash-autosave:.*|image: ghcr.io/hrkcz001/pz-akash-autosave:sha-${SHORT_SHA}|g" pz-autosave/deployment.yaml
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pz-autosave/deployment.yaml
          git commit -m "chore(deploy): update pz-autosave image tag to sha-${SHORT_SHA} [skip ci]" || true
          git push
