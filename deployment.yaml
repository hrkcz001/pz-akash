---
version: "2.0"

endpoints:
  pz-ip:
    kind: ip

services:
  pz-server:
    # This matches the image built by GitHub Actions. Replace "pz-akash" if you name your GitHub repo something else.
    image: ghcr.io/hrkcz001/pz-akash:latest
    pull_policy: always
    env:
      - SSH_PRIVATE_KEY_BASE64=""
      - REPO_URL=git@github.com:hrkcz001/pz-saves.git
      - SAVE_COMMIT_HASH=latest
      - GIT_USER_NAME=hrkcz001
      - GIT_USER_EMAIL=hrkcz001@gmail.com
    expose:
      - port: 16261
        as: 16261
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 16262
        as: 16262
        proto: udp
        to:
          - global: true
            ip: pz-ip
      - port: 27015
        as: 27015
        proto: tcp
        to:
          - global: true
            ip: pz-ip
      - port: 8080
        as: 8080
        proto: tcp
        to:
          - global: false

profiles:
  compute:
    pz-server:
      resources:
        cpu:
          units: 4
        memory:
          size: 10Gi
        storage:
          - size: 10Gi

  placement:
    pz-placement:
      pricing:
        pz-ip:
          denom: uakt
          amount: 10000
        pz-server:
          denom: uakt
          amount: 100000

deployment:
  pz-server:
    pz-placement:
      profile: pz-server
      count: 1