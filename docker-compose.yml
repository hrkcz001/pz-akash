version: '3.8'

services:
  pz-server:
    build: .
    container_name: pz-server
    restart: unless-stopped
    environment:
      - SSH_PRIVATE_KEY_
      - REPO_URL=git@github.com:hrkcz001/pz-saves.git
      - SAVE_COMMIT_HASH=latest
      - GIT_USER_NAME=hrkcz001
      - GIT_USER_EMAIL=hrkcz001@gmail.com
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
